<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Suministros · Almacén</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/sidebar.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="glass sidebar">
    <div class="sidebar-marca">
      <div class="logo-mini-wrap">
        <div class="logo-mini-anillo a1"></div>
        <div class="logo-mini-anillo a2"></div>
        <div class="logo-mini-particula p1"></div>
        <div class="logo-mini-particula p2"></div>
        <div class="logo-mini-halo"></div>
        <div class="logo-mini-central">
          <img src="img/logo.png" alt="Micro Red Paucará"
               onerror="this.style.display='none'; this.parentElement.classList.add('sin-logo');">
          <div class="logo-mini-fallback">✚</div>
        </div>
      </div>
      <h2 class="sidebar-titulo">Patrimonio</h2>
    </div>

    <a href="dashboard.html" class="sidebar-dashboard">
      <span>📊</span>
      <span>Dashboard</span>
    </a>

    <div class="sidebar-modulo" data-modulo="patrimonio">
      <button type="button" class="sidebar-modulo-btn">
        <span class="modulo-icono">🏛️</span>
        <span class="modulo-titulo">Patrimonio</span>
        <span class="modulo-flecha">›</span>
      </button>
      <div class="sidebar-modulo-contenido">
        <a href="bienes.html">🏷️ Bienes</a>
        <a href="actas.html">📄 Actas</a>
      </div>
    </div>

    <div class="sidebar-modulo abierto" data-modulo="almacen">
      <button type="button" class="sidebar-modulo-btn">
        <span class="modulo-icono">📦</span>
        <span class="modulo-titulo">Almacén</span>
        <span class="modulo-flecha">›</span>
      </button>
      <div class="sidebar-modulo-contenido">
        <a href="catalogo-suministros.html" class="active">📋 Catálogo de Suministros</a>
        <a href="ingresos.html">📥 Ingresos</a>
        <a href="salidas.html">📤 Salidas</a>
        <a href="stock.html">📊 Stock</a>
        <a href="kardex.html">🗂️ Kardex</a>
      </div>
    </div>

    <div class="sidebar-modulo" data-modulo="configuracion">
      <button type="button" class="sidebar-modulo-btn">
        <span class="modulo-icono">⚙️</span>
        <span class="modulo-titulo">Configuración</span>
        <span class="modulo-flecha">›</span>
      </button>
      <div class="sidebar-modulo-contenido">
        <a href="establecimientos.html">🏥 Establecimientos</a>
        <a href="profesionales.html">👥 Profesionales</a>
        <a href="encargados.html">🧑‍💼 Responsables</a>
        <a href="usuarios.html">👤 Usuarios</a>
        <a href="reportes.html">📈 Reportes</a>
      </div>
    </div>

    <a href="#" id="logout" style="margin-top:auto;">🚪 Salir</a>
  </aside>

  <main class="main">
    <div class="glass topbar">
      <h1>Catálogo de Suministros</h1>
      <span class="user">👤 <span class="user-nombre"></span></span>
    </div>

    <div class="glass panel" style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;">
      <input id="q" placeholder="🔍 Buscar por código, descripción o unidad..."
             style="flex:1;min-width:220px;padding:.55rem .8rem;border:1px solid #cbd5e1;border-radius:8px;" />
      <button class="btn btn-primary" id="btnNuevo">+ Nuevo suministro</button>
    </div>

    <div class="glass tabla-wrap">
      <table class="inventario" style="min-width:auto;">
        <thead>
          <tr>
            <th style="width:60px;">#</th>
            <th style="width:120px;">Código</th>
            <th>Descripción</th>
            <th style="width:150px;">Unidad</th>
            <th style="width:130px;">Stock mínimo</th>
            <th style="width:140px;text-align:center;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="paginacion-moderna" id="paginacion"></div>
    </div>
  </main>
</div>

<template id="tplForm">
  <div class="modal-backdrop">
    <form class="glass modal" id="formSum" style="max-width:520px;">
      <button type="button" class="btn-close-modal" data-close title="Cerrar">✕</button>
      <h2 id="tituloModal">Nuevo suministro</h2>

      <div class="grid-2">
        <div>
          <label>Código (automático) 🔒</label>
          <input name="codigo" id="inpCodigo" readonly
                 style="background:#f1f5f9;color:#64748b;cursor:not-allowed;font-weight:700;font-family:monospace;" />
        </div>
        <div>
          <label>Unidad de medida</label>
          <input name="unidad_medida" placeholder="Ej: UNIDAD, CAJA, FRASCO" />
        </div>
        <div class="grid-full">
          <label>Descripción *</label>
          <input name="descripcion" required />
        </div>
        <div class="grid-full">
          <label>Stock mínimo</label>
          <input name="stock_minimo" type="number" min="0" value="0" />
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close style="color:#1f2a37;">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</template>

<style>
  .paginacion-moderna { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; padding: 1.2rem .5rem .3rem; border-top: 1px solid #e2e8f0; margin-top: .8rem; }
  .paginacion-moderna:empty { display: none; }
  .paginacion-moderna .info { font-size: .85rem; color: #475569; }
  .paginacion-moderna .info strong { color: #1d6fb3; font-weight: 700; }
  .paginacion-moderna .controles { display: flex; gap: .35rem; align-items: center; }
  .paginacion-moderna button { min-width: 38px; height: 38px; border: 1px solid #e2e8f0; background: #fff; color: #1f2a37; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: all .18s; display: inline-flex; align-items: center; justify-content: center; padding: 0 .55rem; }
  .paginacion-moderna button:hover:not(:disabled):not(.activo) { background: #eff6ff; border-color: #93c5fd; color: #1d6fb3; }
  .paginacion-moderna button:disabled { opacity: .35; cursor: not-allowed; }
  .paginacion-moderna button.activo { background: linear-gradient(135deg, #1d6fb3, #0ea5e9); color: #fff; border-color: transparent; }
  .paginacion-moderna .ellipsis { padding: 0 .3rem; color: #94a3b8; font-weight: 700; }
  .row-actions button { border: none; padding: .4rem .65rem; border-radius: 8px; font-size: .85rem; cursor: pointer; font-weight: 600; margin: 0 .15rem; }
  .row-actions .edit { background: #dbeafe; color: #1d6fb3; }
  .row-actions .edit:hover { background: #bfdbfe; }
  .row-actions .del { background: #fee2e2; color: #991b1b; }
  .row-actions .del:hover { background: #fecaca; }
</style>

<script type="module">
  import { api, protegerPagina, logout, escapeHtml } from './js/api.js';
  import UI from './js/ui.js';
  await protegerPagina();
  logout();

  function activarCierreModal(modalEl) {
    modalEl.querySelectorAll('[data-close]').forEach(btn =>
      btn.addEventListener('click', () => modalEl.remove()));
    modalEl.addEventListener('click', e => { if (e.target === modalEl) e.stopPropagation(); });
    const onEsc = e => { if (e.key === 'Escape') { modalEl.remove(); document.removeEventListener('keydown', onEsc); } };
    document.addEventListener('keydown', onEsc);
  }

  let suministros = [];
  let suministrosFiltrados = [];
  let paginaActual = 1;
  const POR_PAGINA = 5;
  let editandoId = null;

  const tbody = document.getElementById('tbody');
  const paginacion = document.getElementById('paginacion');

  function normalizar(txt) {
    return String(txt || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  async function cargar() {
    suministros = await api('/api/suministros');
    aplicarFiltros();
  }

  function aplicarFiltros() {
    const q = normalizar(document.getElementById('q').value.trim());
    suministrosFiltrados = suministros.filter(s => {
      if (!q) return true;
      return normalizar(s.codigo).includes(q) ||
             normalizar(s.descripcion).includes(q) ||
             normalizar(s.unidad_medida).includes(q);
    });
    paginaActual = 1;
    render();
  }

  function render() {
    tbody.innerHTML = '';
    const total = suministrosFiltrados.length;
    const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    const inicio = (paginaActual - 1) * POR_PAGINA;
    const fin = inicio + POR_PAGINA;
    const pagina = suministrosFiltrados.slice(inicio, fin);

    if (pagina.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#64748b;">No hay suministros.</td></tr>';
      paginacion.innerHTML = '';
      return;
    }

    pagina.forEach((s, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:700;color:#64748b;">${inicio + idx + 1}</td>
        <td><span style="font-family:monospace;background:#eff6ff;color:#1d6fb3;padding:.25rem .55rem;border-radius:6px;font-weight:700;">${escapeHtml(s.codigo || '—')}</span></td>
        <td style="font-weight:600;">${escapeHtml(s.descripcion)}</td>
        <td>${escapeHtml(s.unidad_medida || '—')}</td>
        <td><span style="background:#fef3c7;color:#92400e;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;">${s.stock_minimo}</span></td>
        <td class="row-actions" style="text-align:center;">
          <button class="edit" data-id="${s.id}">✏️ Editar</button>
          <button class="del" data-id="${s.id}">🗑️</button>
        </td>`;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.edit').forEach(b => b.addEventListener('click', () => abrirModal(suministros.find(x => x.id == b.dataset.id))));
    tbody.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => eliminar(suministros.find(x => x.id == b.dataset.id))));
    renderPaginacion(totalPaginas, inicio, fin, total);
  }

  function renderPaginacion(totalPaginas, inicio, fin, total) {
    const mostrados = Math.min(fin, total);
    let html = `<div class="info">Mostrando <strong>${inicio + 1}</strong>–<strong>${mostrados}</strong> de <strong>${total}</strong> suministro(s)</div>`;
    html += `<div class="controles">`;
    html += `<button ${paginaActual === 1 ? 'disabled' : ''} data-p="1">«</button>`;
    html += `<button ${paginaActual === 1 ? 'disabled' : ''} data-p="${paginaActual - 1}">‹</button>`;
    for (let i = 1; i <= totalPaginas; i++) {
      if (i === 1 || i === totalPaginas || Math.abs(i - paginaActual) <= 1) {
        html += `<button class="${i === paginaActual ? 'activo' : ''}" data-p="${i}">${i}</button>`;
      } else if (i === 2 && paginaActual > 3) {
        html += `<span class="ellipsis">…</span>`;
      } else if (i === totalPaginas - 1 && paginaActual < totalPaginas - 2) {
        html += `<span class="ellipsis">…</span>`;
      }
    }
    html += `<button ${paginaActual === totalPaginas ? 'disabled' : ''} data-p="${paginaActual + 1}">›</button>`;
    html += `<button ${paginaActual === totalPaginas ? 'disabled' : ''} data-p="${totalPaginas}">»</button>`;
    html += `</div>`;
    paginacion.innerHTML = html;
    paginacion.querySelectorAll('button[data-p]').forEach(btn =>
      btn.addEventListener('click', () => {
        const p = Number(btn.dataset.p);
        if (p >= 1 && p <= totalPaginas && p !== paginaActual) { paginaActual = p; render(); }
      }));
  }

  async function eliminar(s) {
    if (!s) return;
    const ok = await UI.confirm(`¿Desactivar el suministro "${s.descripcion}"?`, 'Confirmar', { textoAceptar: 'Desactivar', tipo: 'warning' });
    if (!ok) return;
    try {
      await api('/api/suministros/' + s.id, { method: 'DELETE' });
      await UI.success('Suministro desactivado.');
      cargar();
    } catch (err) { UI.error(err.message); }
  }

  async function abrirModal(s = null) {
    editandoId = s?.id || null;
    const tpl = document.getElementById('tplForm').content.cloneNode(true);
    document.body.appendChild(tpl);
    const modal = document.body.lastElementChild;

    if (s) {
      modal.querySelector('#tituloModal').textContent = 'Editar suministro';
      modal.querySelector('#inpCodigo').value = s.codigo || '';
      modal.querySelector('[name="descripcion"]').value = s.descripcion || '';
      modal.querySelector('[name="unidad_medida"]').value = s.unidad_medida || '';
      modal.querySelector('[name="stock_minimo"]').value = s.stock_minimo || 0;
    } else {
      try {
        const r = await api('/api/suministros/siguiente-codigo');
        modal.querySelector('#inpCodigo').value = r.codigo;
      } catch { modal.querySelector('#inpCodigo').value = ''; }
    }

    activarCierreModal(modal);

    modal.querySelector('#formSum').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target));
      payload.stock_minimo = Number(payload.stock_minimo) || 0;
      try {
        if (editandoId) {
          await api('/api/suministros/' + editandoId, { method: 'PUT', body: payload });
          await UI.success('Suministro actualizado.');
        } else {
          await api('/api/suministros', { method: 'POST', body: payload });
          await UI.success('Suministro creado.');
        }
        modal.remove();
        cargar();
      } catch (err) { UI.error(err.message); }
    });
  }

  document.getElementById('btnNuevo').addEventListener('click', () => abrirModal(null));
  document.getElementById('q').addEventListener('input', () => aplicarFiltros());

  await cargar();
</script>
</body>
</html>
